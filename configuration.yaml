# configuration.yaml

data:
  pkl_name: './data_pkl-100ms.pkl'  # data_pkl.pkl OR data_pkl-100ms.pkl OR data_pkl-50ms.pkl
  val_samples: ['02', '07']
  test_samples: ['12', '13', '15', '28', '31']

model:
  name: "transformer"  # LSTM1 or GRU1 or EALSTM
  num_layers: None
  seq_length_s: 3
  samp_interval_s: 0.1  # 0.2 OR 0.1 OR 0.05
  predict_next_t: 1  # horizon of predicting the next {}th time sample (y)
  input_dim: 14  # Original: 54, Abla: {9, 12, 13, 14,}
  # for RNNs
  hidden_dim1: 32  # 42
  hidden_dim2: 2  # 20
  #hidden_dim3: 0
  dropout_prob: 0.1

optimizer:
  name: "AdamW"  # RMSprop, Adam, AdamW
  schedule: "cosine"  # linear, cosine, plateau
  lr: 0.0001
  lr_step_size: 40
  gamma: 0.01

training:
  batch_size: 64
  epochs: 50
  early_stop_patience: 7
  saved_dir: "./checkpoints_crossformer"
  saved_best_model: "-"
  is_only_last_timestep: 1
  custom_weighted_loss: "linear"  # "linear" or "softmax"
